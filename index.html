<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3M 컨텐츠 | Linker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<style>
  :root{
    --3m-red:#ff0000;--ink:#1a1a1a;--paper:#ffffff;--line:#e2e2e2;--muted:#9a9a9a;
    --blue:#2f6df6;--blue-d:#2456c9;--green:#1faa59;--green-d:#178a47;
    --kor:"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:"Archivo",var(--kor);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  .container{max-width:1100px;margin:0 auto;padding:0 24px}
  .logos{display:flex;align-items:center;justify-content:center;position:relative;padding:40px 0 10px}
  .logos .linker{position:absolute;left:24px;top:40px;background:#000;color:#fff;font-weight:900;letter-spacing:.5px;padding:12px 14px;border-radius:8px;font-size:16px;line-height:1.1;text-align:center}
  .logos .linker small{display:block;font-size:11px;font-weight:700;margin-top:2px}
  .logos .m3{color:var(--3m-red);font-weight:900;font-size:54px;letter-spacing:-2px}
  .nav{display:flex;justify-content:center;gap:26px;padding:18px 0 26px}
  .nav a{text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;font-family:var(--kor);cursor:pointer}
  .nav a.active{font-weight:800}
  .nav a:hover{color:var(--3m-red)}
  .catgrid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .catgrid button{background:#fff;border:none;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 10px;font-size:14.5px;font-family:var(--kor);color:#333;cursor:pointer;font-weight:500;transition:.12s}
  .catgrid button:nth-child(3n){border-right:none}
  .catgrid button:hover{background:#f7f7f7}
  .catgrid button.active{background:var(--ink);color:#fff;font-weight:700}
  .divider{height:2px;background:var(--3m-red);margin:46px 0 30px;border-radius:2px}
  .search-title{color:var(--3m-red);font-weight:800;font-size:18px;font-family:var(--kor);margin-bottom:14px}
  .search{position:relative;margin-bottom:26px}
  .search input{width:100%;padding:14px 16px 14px 46px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;font-family:var(--kor);outline:none;transition:border-color .15s,box-shadow .15s}
  .search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);opacity:.4}
  .tablecard{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:14px;font-weight:700;color:#333;font-family:var(--kor);padding:15px 20px;background:#f6f6f6;border-bottom:1px solid var(--line)}
  thead th.c{text-align:center;width:130px}
  tbody td{padding:15px 20px;border-bottom:1px solid var(--line);vertical-align:middle;font-family:var(--kor)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafafa}
  .cat{display:inline-block;font-size:13px;font-weight:600;color:#666}
  .pname{font-weight:600;font-size:15px;color:var(--ink)}
  td.c{text-align:center}
  .btn{border:none;cursor:pointer;font-weight:700;font-size:13px;padding:9px 18px;border-radius:7px;color:#fff;font-family:var(--kor);transition:transform .08s,filter .15s}
  .btn:active{transform:scale(.96)}
  .btn-prev{background:var(--blue)}
  .btn-prev:hover{background:var(--blue-d)}
  .btn-dl{background:var(--green);text-decoration:none;display:inline-block}
  .btn-dl:hover{background:var(--green-d)}
  .btn-dl.none{background:#ccc;pointer-events:none}
  .empty{padding:50px 20px;text-align:center;color:var(--muted);font-family:var(--kor)}
  .count{margin:0 2px 12px;color:var(--muted);font-size:13px;font-family:var(--kor)}
  footer{text-align:center;padding:60px 24px 70px;margin-top:40px}
  footer .ig{display:inline-block;margin-bottom:16px;opacity:.7;color:#555}
  footer h4{font-family:var(--kor);font-size:15px;font-weight:800;margin-bottom:6px}
  footer h4 .r{color:var(--3m-red)}
  footer p{font-family:var(--kor);font-size:13.5px;color:#888}
  .overlay{position:fixed;inset:0;z-index:80;background:rgba(15,15,18,.72);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:900px;width:100%;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .22s ease}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .modal-head .cat{font-weight:700;color:#666;font-family:var(--kor)}
  .modal-head h3{font-size:17px;font-weight:800;font-family:var(--kor);flex:1}
  .modal-close{border:none;background:#f0f0f0;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:17px;color:#555}
  .modal-close:hover{background:#e4e4e4}
  .modal-body{max-height:88vh;overflow-y:auto;background:#fbfbfb}
  .modal-body img{width:100%;display:block}
  .modal-body .loading{padding:50px;text-align:center;color:#999;font-family:var(--kor)}
  .modal-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
  .modal-foot .btn-dl{padding:12px 24px;font-size:14px}
  .admin-panel{display:none;border:1px solid var(--line);border-radius:12px;padding:28px;margin-top:10px;background:#fafafa}
  .admin-panel.open{display:block}
  .admin-panel h3{font-family:var(--kor);font-size:17px;font-weight:800;margin-bottom:18px;color:var(--ink)}
  .admin-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px;font-family:var(--kor);font-size:14px}
  .admin-row label{font-weight:600;min-width:64px}
  .admin-row input,.admin-row select{padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-family:var(--kor);font-size:14px}
  .quick{padding:7px 12px;border:1px solid var(--line);background:#fff;border-radius:999px;font-size:13px;cursor:pointer;font-family:var(--kor)}
  .quick:hover{background:#eee}
  .admin-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .btn-lg{padding:13px 22px;font-size:14px;border-radius:9px}
  .btn-xlsx{background:#1f7a44}
  .btn-ppt{background:#c0392b}
  .pwbox{display:none;border:1px solid var(--line);border-radius:12px;padding:40px;margin-top:10px;text-align:center;background:#fafafa}
  .pwbox.open{display:block}
  .pwbox input{padding:12px 16px;border:1px solid var(--line);border-radius:9px;font-size:16px;text-align:center;letter-spacing:3px;width:180px;font-family:var(--kor)}
  .pwbox .btn{margin-top:14px;background:var(--ink)}
  .status{margin-top:16px;font-family:var(--kor);font-size:13.5px;color:#666;min-height:20px}
  .err{color:var(--3m-red);font-family:var(--kor);font-size:13px;margin-top:8px;min-height:18px}
  @media(max-width:680px){
    .logos .m3{font-size:40px}
    .logos .linker{position:static;margin:0 auto 16px}
    .logos{flex-direction:column}
    .catgrid{grid-template-columns:repeat(2,1fr)}
    .catgrid button:nth-child(3n){border-right:1px solid var(--line)}
    .catgrid button:nth-child(2n){border-right:none}
    thead th:nth-child(1),tbody td:nth-child(1){display:none}
  }
</style>
</head>
<body>
<div class="container">
  <div class="logos">
    <div class="linker" onclick="goHome()" style="cursor:pointer">k<small>Linker</small></div>
    <div class="m3" onclick="goHome()" style="cursor:pointer">3M</div>
  </div>
  <nav class="nav">
    <a id="nav-content" class="active" onclick="showContent()">컨텐츠</a>
    <a id="nav-admin" onclick="showAdmin()">admin</a>
  </nav>

  <div id="content-view">
    <div class="catgrid" id="catgrid"></div>
    <div class="divider"></div>
    <div class="search-title">제품명 검색</div>
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="제품명을 검색하세요…">
    </div>
    <div class="count" id="count">불러오는 중…</div>
    <div class="tablecard">
      <table>
        <thead><tr><th>구분</th><th>제품명</th><th class="c">미리보기</th><th class="c">다운로드</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="pwbox" id="pwbox">
    <div style="font-family:var(--kor);font-weight:700;margin-bottom:16px">🔒 관리자 전용 — 비밀번호를 입력하세요</div>
    <input id="pw" type="password" maxlength="12" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="err" id="pwerr"></div>
    <div><button class="btn" onclick="checkPw()">입장</button></div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <h3>📊 PPT 보고서 생성</h3>
    <div class="admin-row">
      <label>기간</label>
      <input type="date" id="dateFrom"> ~ <input type="date" id="dateTo">
    </div>
    <div class="admin-row">
      <span class="quick" onclick="quickRange(7)">최근 7일</span>
      <span class="quick" onclick="quickRange(30)">최근 30일</span>
      <span class="quick" onclick="quickMonth()">이번 달</span>
      <span class="quick" onclick="clearRange()">전체</span>
    </div>
    <div class="admin-row">
      <label>카테고리</label>
      <select id="adminCat"></select>
    </div>
    <div class="status" id="adminStatus">대상: 전체 제품</div>
    <div class="admin-actions">
      <button class="btn btn-lg btn-ppt" onclick="makePPT()">📊 PPT 생성</button>
      <button class="btn btn-lg btn-xlsx" onclick="makeXLSX()">📥 제작 리스트 엑셀</button>
      <button class="btn btn-lg" style="background:#555" onclick="checkMatch()">🔗 이미지 매칭 확인</button>
    </div>
    <div id="matchResult" style="margin-top:18px;font-family:var(--kor);font-size:13px;display:none"></div>
    <div class="err" id="adminErr"></div>
  </div>
</div>

<footer>
  <h4><span class="r">3M</span> 자료 공유 사이트</h4>
  <p>현 사이트는 링커(Linker)의 작업물, 자료 등을 3M과 공유하기 위한 별도의 사이트 입니다.</p>
</footer>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="cat" id="m-cat"></span>
      <h3 id="m-name"></h3>
      <button class="modal-close" id="m-close">✕</button>
    </div>
    <div class="modal-body" id="m-body"></div>
    <div class="modal-foot"><a class="btn btn-dl" id="m-dl" target="_blank">다운로드</a></div>
  </div>
</div>

<script>
/* ===================== 설정 ===================== */
const CONFIG = {
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vR51nrZo0fd1cPbNUYG1Pqw0_zOux2Z1lkG353JTeuHJ_c28ePAgTyyd91EmjVfeQ/pub?gid=1675444034&single=true&output=csv",
  // Cloudflare R2 공개 주소 (이미지 직접 표시용)
  R2_BASE: "https://pub-d90c2aac746d47f9b1151fde9613db98.r2.dev",
  // R2 목록 Worker (폴더 안 파일 목록 가져오기용)
  WORKER_BASE: "https://linker3m-r2-list.dr78home.workers.dev",
  ADMIN_PW: "9087"
};
const CAT_ORDER=["쇼츠영상","개인안전보호구","에어로졸/접착제","산업용 테이프","자동차유지보수","건물 유지관리","헬스케어","필터제품","위생관리용품","연마제","썸네일"];

const DEMO=[
  {category:"개인안전보호구",name:"보안경 334AF",download:"https://mega.nz/예시링크",date:"2026-05-27"},
  {category:"개인안전보호구",name:"SF400 시리즈",download:"https://mega.nz/예시링크",date:"2026-05-20"},
  {category:"산업용 테이프",name:"VHB 테이프 5611N-GF",download:"https://mega.nz/예시링크",date:"2026-05-10"},
  {category:"연마제",name:"큐비트론3 소패키지",download:"https://mega.nz/예시링크",date:"2026-04-28"}
];

let PRODUCTS=[];
let activeCat="전체";

/* ===================== 시트 로딩 ===================== */
function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){cur+='"';i++}else q=false}else cur+=c}
    else{if(c=='"')q=true;else if(c==',')row.push(cur),cur="";else if(c=='\n'||c=='\r'){if(cur!==""||row.length){row.push(cur);rows.push(row);row=[];cur=""}if(c=='\r'&&text[i+1]=='\n')i++}else cur+=c}}
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows;
}
async function loadProducts(){
  PRODUCTS=[];
  if(!CONFIG.SHEET_CSV_URL){
    PRODUCTS=DEMO.slice();
    afterLoad("시트 주소가 설정되지 않았습니다.");
    return;
  }
  try{
    const res=await fetch(CONFIG.SHEET_CSV_URL);const txt=await res.text();
    const rows=parseCSV(txt);const head=rows[0].map(h=>h.trim());
    const idx=n=>head.findIndex(h=>h.replace(/\s/g,"").includes(n));
    const ci=idx("구분"),ni=idx("제품명"),di=idx("다운로드"),ti=idx("등록일"),fi=idx("폴더명");
    PRODUCTS=rows.slice(1).filter(r=>r[ni]&&r[ni].trim()).map(r=>({
      category:(r[ci]||"").trim(),
      name:(r[ni]||"").trim(),
      download:(r[di]||"").trim(),
      date:normDate((r[ti]||"").trim()),
      folder:(fi>=0&&r[fi]?r[fi].trim():"")
    }));
    afterLoad("");
  }catch(e){
    PRODUCTS=DEMO.slice();
    afterLoad("시트를 불러오지 못했습니다. 데모 데이터를 표시합니다.");
  }
}

function normDate(v){
  if(!v) return "";
  v=String(v).trim();
  let m=v.match(/(\d{2,4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
  if(m){
    let y=m[1]; if(y.length===2) y="20"+y;
    let mo=("0"+m[2]).slice(-2), d=("0"+m[3]).slice(-2);
    return `${y}-${mo}-${d}`;
  }
  return v;
}

function afterLoad(msg){buildCats();render();fillAdminCat();if(msg)document.getElementById('count').textContent=msg}

/* ===================== 카테고리/표 ===================== */
function buildCats(){
  const present=CAT_ORDER.filter(c=>PRODUCTS.some(p=>p.category===c));
  const extra=[...new Set(PRODUCTS.map(p=>p.category))].filter(c=>!CAT_ORDER.includes(c)&&c);
  const cats=["전체",...present,...extra];
  const el=document.getElementById('catgrid');
  el.innerHTML=cats.map(c=>`<button class="${c==='전체'?'active':''}" data-cat="${c}">${c}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;el.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));render()});
}
document.getElementById('q').oninput=render;
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const list=PRODUCTS.filter(p=>(activeCat==="전체"||p.category===activeCat)&&(q===""||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));
  document.getElementById('count').textContent=`총 ${list.length}개 제품`;
  const rowsEl=document.getElementById('rows');
  if(!list.length){rowsEl.innerHTML=`<tr><td colspan="4" class="empty">검색 결과가 없습니다.</td></tr>`;return}
  rowsEl.innerHTML=list.map(p=>{
    const i=PRODUCTS.indexOf(p);
    let dl;
    const isVideo = (p.category||"").includes("쇼츠");
    if(isVideo && p.download){
      dl = `<a class="btn btn-dl" href="${p.download}" target="_blank" rel="noopener">다운로드</a>`;
    }else if(!isVideo){
      dl = `<button class="btn btn-dl" data-zip="${i}">다운로드</button>`;
    }else{
      dl = `<a class="btn btn-dl none">준비중</a>`;
    }
    return `<tr><td><span class="cat">${p.category}</span></td><td><span class="pname">${p.name}</span></td><td class="c"><button class="btn btn-prev" data-i="${i}">미리보기</button></td><td class="c">${dl}</td></tr>`;
  }).join('');
  rowsEl.querySelectorAll('.btn-prev').forEach(b=>b.onclick=()=>openModal(PRODUCTS[b.dataset.i]));
  rowsEl.querySelectorAll('.btn-dl[data-zip]').forEach(b=>b.onclick=()=>downloadAsZip(PRODUCTS[b.dataset.zip], b));
}

/* ===================== R2 폴더 이미지 가져오기 (Worker /list) ===================== */
const imgCache={};
const IMG_EXT=["png","gif","jpg","jpeg","webp"];

// 파일명 앞 숫자 추출 (01_인트로->1, 4_추천->4, 10.png->10, 인트로->큰수)
function leadNum(key){
  const fname = key.split("/").pop().replace(/\.[^.]+$/,"");
  const m = fname.match(/^\s*(\d+)/);
  return m ? parseInt(m[1],10) : 99999;
}
function isImageKey(key){
  const ext=(key.split(".").pop()||"").toLowerCase();
  return IMG_EXT.includes(ext);
}

// 폴더 안 모든 이미지를 번호순으로 가져온다 (파일명 규칙 무관)
async function fetchImagesR2(folderName){
  if(imgCache[folderName]) return imgCache[folderName];
  try{
    const prefix = folderName.endsWith("/") ? folderName : folderName+"/";
    const res = await fetch(`${CONFIG.WORKER_BASE}/list?prefix=${encodeURIComponent(prefix)}`);
    const data = await res.json();
    const imgs = (data.items||[])
      .filter(it => it.size>0 && isImageKey(it.key))   // 폴더(0byte)·비이미지 제외
      .sort((a,b)=> leadNum(a.key)-leadNum(b.key))      // 앞 숫자 순 정렬
      .map(it => it.url);
    imgCache[folderName]=imgs;
    return imgs;
  }catch(e){
    return [];
  }
}

/* ===================== 미리보기 모달 ===================== */
const overlay=document.getElementById('overlay');
async function openModal(p){
  document.getElementById('m-cat').textContent=p.category;
  document.getElementById('m-name').textContent=p.name;
  const body=document.getElementById('m-body');
  body.innerHTML=`<div class="loading">이미지를 불러오는 중…</div>`;
  const dl=document.getElementById('m-dl');
  const isVideo = (p.category||"").includes("쇼츠");
  if(isVideo && p.download){
    dl.href=p.download; dl.setAttribute('target','_blank'); dl.onclick=null;
    dl.style.display="inline-block"; dl.textContent="다운로드";
  }else if(!isVideo){
    dl.removeAttribute('href'); dl.removeAttribute('target');
    dl.onclick=(e)=>{e.preventDefault();downloadAsZip(p,dl);};
    dl.style.display="inline-block"; dl.textContent="다운로드 (이미지 zip)";
  }else{
    dl.style.display="none";
  }
  overlay.classList.add('open');document.body.style.overflow='hidden';
  const folderName = p.folder || p.name;
  const imgs = await fetchImagesR2(folderName);
  if(!imgs.length){body.innerHTML=`<div class="loading">등록된 미리보기 이미지가 없습니다.<br><span style="font-size:12px">R2 ${folderName}/ 폴더에 이미지를 올리면 표시됩니다.</span></div>`;return}

}

/* ----- PPT ----- */
async function makePPT(){
  const list=getFiltered();
  const errEl=document.getElementById('adminErr');errEl.textContent="";
  if(!list.length){errEl.textContent="대상 제품이 없습니다. 기간/카테고리를 확인하세요.";return}
  if(typeof PptxGenJS==='undefined'){errEl.textContent="PPT 생성 도구를 불러오지 못했습니다. 잠시 후 새로고침 해주세요.";return}
  const stat=document.getElementById('adminStatus');
  const pptx=new PptxGenJS();pptx.defineLayout({name:'W',width:13.33,height:7.5});pptx.layout='W';
  let s=pptx.addSlide();s.background={color:"111111"};
  s.addText("Linker_제작물",{x:0.5,y:2.8,w:12.3,h:1,fontSize:40,bold:true,color:"FFFFFF",align:"center",fontFace:"맑은 고딕"});
  const f=document.getElementById('dateFrom').value,t=document.getElementById('dateTo').value;
  const rangeTxt=(f||t)?`${f||"처음"} ~ ${t||"끝"}`:"전체 기간";
  s.addText(`${rangeTxt}   |   총 ${list.length}개 컨텐츠`,{x:0.5,y:4.0,w:12.3,h:0.5,fontSize:18,color:"BBBBBB",align:"center",fontFace:"맑은 고딕"});
  s.addText(fmt(new Date()),{x:0.5,y:4.6,w:12.3,h:0.4,fontSize:14,color:"888888",align:"center",fontFace:"맑은 고딕"});

  for(let k=0;k<list.length;k++){
    const p=list[k];stat.textContent=`PPT 생성 중… ${k+1}/${list.length} (${p.name})`;
    const sl=pptx.addSlide();
    sl.addText(p.name,{x:0.4,y:0.3,w:12.5,h:0.6,fontSize:24,bold:true,fontFace:"맑은 고딕"});
    sl.addText(`Download : ${p.download||"-"}`,{x:0.4,y:1.0,w:12.5,h:0.4,fontSize:12,color:"1f7a44",fontFace:"맑은 고딕"});
    sl.addText(`등록일 : ${p.date||"-"}`,{x:0.4,y:1.4,w:12.5,h:0.4,fontSize:12,color:"888888",fontFace:"맑은 고딕"});
    const folderName = p.folder || p.name;
    const imgs = await fetchImagesR2(folderName);
    const n=Math.min(imgs.length,12);
    if(n>0){
      const cols=n<=4?n:(n<=6?3:4);const rows=Math.ceil(n/cols);
      const gx=0.4,gy=2.0,gw=12.5,gh=5.3;const cw=gw/cols,ch=gh/rows;
      for(let i=0;i<n;i++){
        const r=Math.floor(i/cols),c=i%cols;
        try{
          const dataUrl=await toDataURL(imgs[i]);
          sl.addImage({data:dataUrl,x:gx+c*cw+0.1,y:gy+r*ch+0.1,w:cw-0.2,h:ch-0.2,sizing:{type:"contain",w:cw-0.2,h:ch-0.2}});
        }catch(e){}
      }
    }else{
      sl.addText("(미리보기 이미지 없음)",{x:0.4,y:3.5,w:12.5,h:0.5,fontSize:14,color:"AAAAAA",align:"center",fontFace:"맑은 고딕"});
    }
  }
  stat.textContent="PPT 저장 중…";
  await pptx.writeFile({fileName:`Linker_제작물_${fmt(new Date())}.pptx`});
  updateAdminStatus();
}
function toDataURL(url){
  return new Promise((resolve,reject)=>{
    const img=new Image();img.crossOrigin="anonymous";
    img.onload=()=>{const cv=document.createElement('canvas');const max=900;let{width:w,height:h}=img;if(w>max){h=h*max/w;w=max}cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);try{resolve(cv.toDataURL('image/jpeg',0.75))}catch(e){reject(e)}};
    img.onerror=reject;img.src=url;
  });
}

async function checkMatch(){
  const box=document.getElementById('matchResult');
  box.style.display='block';
  box.innerHTML="R2 폴더 상태를 확인하는 중… (시간이 좀 걸립니다)";

    const p=PRODUCTS[i];
    const folderName=p.folder||p.name;
    const imgs=await fetchImagesR2(folderName);

      if(p.download) withImg.push(`${p.category||"미분류"} / ${p.name} (이미지 ${imgs.length}장)`);
      else noDl.push(`${p.category||"미분류"} / ${p.name}`);
    }else{
      noImg.push(`${p.category||"미분류"} / ${p.name}`);
    }
    box.innerHTML=`확인 중… ${i+1}/${PRODUCTS.length}`;
  }
  let html=`<div style="margin-bottom:10px;font-size:14px"><b>완성:</b> ${withImg.length}개 &nbsp;|&nbsp; <b style="color:#c0392b">이미지 없음:</b> ${noImg.length}개 &nbsp;|&nbsp; <b style="color:#d68910">다운로드 링크 없음:</b> ${noDl.length}개</div>`;
  if(noImg.length){
    html+=`<div style="background:#fff3f3;border:1px solid #f0c0c0;border-radius:8px;padding:12px;margin-bottom:10px"><b>R2에 이미지 폴더가 아직 안 올라간 제품:</b><br>`+noImg.map(m=>"· "+m).join("<br>")+`</div>`;
  }
  if(noDl.length){
    html+=`<div style="background:#fff9e6;border:1px solid #f0d8a0;border-radius:8px;padding:12px;margin-bottom:10px"><b>이미지는 있는데 시트에 다운로드 링크 없음:</b><br>`+noDl.map(m=>"· "+m).join("<br>")+`</div>`;
  }
  html+=`<details><summary style="cursor:pointer;color:#2456c9">완성된 제품 ${withImg.length}개 보기</summary><div style="max-height:240px;overflow:auto;background:#f7f7f7;border-radius:8px;padding:12px;margin-top:8px;font-size:12.5px;line-height:1.8">`+withImg.map(o=>o).join("<br>")+`</div></details>`;
  box.innerHTML=html;
}

/* R2 이미지를 zip으로 묶어 다운로드 */
async function downloadAsZip(p, btnEl){
  const folderName = p.folder || p.name;
  const originalText = btnEl.textContent;
  btnEl.textContent = "준비 중…";
  btnEl.style.pointerEvents = "none";
  try{
    const imgs = await fetchImagesR2(folderName);
    if(!imgs.length){ alert("이 제품의 이미지가 R2에 아직 없습니다."); return; }
    if(typeof JSZip === "undefined"){ alert("zip 라이브러리를 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요."); return; }
    const zip = new JSZip();
    btnEl.textContent = `0/${imgs.length} 다운로드 중…`;
    for(let i=0; i<imgs.length; i++){
      try{
        const r = await fetch(imgs[i]);
        const blob = await r.blob();
        const ext = imgs[i].split(".").pop().split("?")[0];
        zip.file(`${i+1}.${ext}`, blob);
        btnEl.textContent = `${i+1}/${imgs.length} 다운로드 중…`;
      }catch(e){}
    }
    btnEl.textContent = "압축 중…";
    const blob = await zip.generateAsync({type:"blob"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${folderName}.zip`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    alert("다운로드 중 오류가 발생했습니다: " + e.message);
  }finally{
    btnEl.textContent = originalText;
    btnEl.style.pointerEvents = "";
  }
}
